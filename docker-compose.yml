services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wafi_os}
      POSTGRES_USER: ${POSTGRES_USER:-wafi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - wafi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-wafi} -d ${POSTGRES_DB:-wafi_os}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wafi_postgres_data:
