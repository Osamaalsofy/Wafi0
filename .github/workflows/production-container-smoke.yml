name: Production container smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  production-container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: ./scripts/production-container-smoke.sh
